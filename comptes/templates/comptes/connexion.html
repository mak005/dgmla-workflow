{% extends 'base.html' %}
{% block title %}
  Connexion
{% endblock %}

{% block page_title %}
  <h1 class="text-2xl text-center my-6">CONNEXION</h1>
{% endblock %}

{% block content %}
  <div class="max-w-md mx-auto py-20 text-center">
    <form method="post">
      {% csrf_token %}

      <div class="text-left mb-8">{{ form.username }}</div>

      <div class="text-left mb-10">{{ form.password }}</div>

      {% if form.non_field_errors %}
        <p class="text-sg-red mb-6">{{ form.non_field_errors }}</p>
      {% endif %}

      <div class="flex justify-center gap-4">
        <a href="/" class="px-4 py-2 bg-sg-black text-white text-sm hover:opacity-80">ANNULER</a>
        <button type="submit" class="px-4 py-2 bg-sg-red text-white text-sm hover:opacity-80">VALIDER</button>
      </div>
    </form>
  </div>
{% endblock %}
